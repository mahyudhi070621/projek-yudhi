<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel PMS - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <img class="logo" src="logo.PNG" alt="Logo Hotel">
        <div>
          <h1>Hotel PMS</h1>
          <p>Management System</p>
        </div>
      </div>

      <h2>Login</h2>
      <p class="subtitle">Masuk ke sistem hotel</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>

        <button type="submit">Masuk</button>
        <p id="message" class="message" role="alert"></p>
      </form>

      <div class="demo">
        <strong>Demo:</strong> admin / admin123
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
