<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hotel PMS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard { width:min(900px,100%); margin:0 auto; padding:30px 20px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:25px; }
    .top h1 { margin:0; }
    .logout { width:auto; margin:0; padding:10px 18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; }
    .box { background:white; padding:22px; border-radius:14px; box-shadow:0 8px 25px rgba(0,0,0,.06); }
    .number { font-size:30px; font-weight:700; margin-top:8px; }
  </style>
</head>
<body>
  <main class="dashboard">
    <div class="top">
      <div>
        <h1>Dashboard Hotel PMS</h1>
        <p>Selamat datang, Admin.</p>
      </div>
      <button class="logout" id="logout">Keluar</button>
    </div>

    <div class="grid">
      <div class="box">Total Kamar<div class="number">72</div></div>
      <div class="box">Available<div class="number">50</div></div>
      <div class="box">Occupied<div class="number">22</div></div>
      <div class="box">Check-in Hari Ini<div class="number">8</div></div>
    </div>
  </main>

  <script>
    if (sessionStorage.getItem("demoLoggedIn") !== "true") {
      window.location.href = "index.html";
    }

    document.getElementById("logout").addEventListener("click", () => {
      sessionStorage.removeItem("demoLoggedIn");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
